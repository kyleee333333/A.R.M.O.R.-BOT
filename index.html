<!-- ================================================= -->
<!-- WEBSITE FLOOD STATUS + ALARM CONTROLLER -->
<!-- ================================================= -->

<script>

(function () {

  const MAX_HEIGHT_CM = 220.98;

  const MEDIUM_THRESHOLD = 40;
  const HIGH_THRESHOLD = 70;

  let alarmEnabled = false;
  let alarmMuted = false;
  let audioContext = null;
  let alarmTimer = null;

  let lastCalculatedStatus = "SAFE";


  const enableBtn =
    document.getElementById("enableAlarmBtn");

  const muteBtn =
    document.getElementById("muteAlarmBtn");

  const alarmPanel =
    document.getElementById("alarmPanel");

  const alarmIcon =
    document.getElementById("alarmIcon");

  const alarmTitle =
    document.getElementById("alarmTitle");

  const alarmMessage =
    document.getElementById("alarmMessage");

  const liveAlarm =
    document.getElementById("liveAlarm");

  const liveAlarmStatus =
    document.getElementById("liveAlarmStatus");

  const liveAlarmCondition =
    document.getElementById("liveAlarmCondition");

  const systemAlarm =
    document.getElementById("systemAlarm");


  // ============================================
  // GET SENSOR STATE
  // ============================================

  function isActive(id) {

    const element =
      document.getElementById(id);

    if (!element) {
      return false;
    }

    const text =
      element.textContent
        .trim()
        .toUpperCase();

    return (
      text === "ACTIVE" ||
      text === "ON" ||
      text === "DETECTED"
    );
  }


  // ============================================
  // GET WATER LEVEL
  // ============================================

  function getWaterLevel() {

    const element =
      document.getElementById("waterLevel");

    if (!element) {
      return 0;
    }

    const value =
      parseFloat(
        element.textContent
      );

    if (!Number.isFinite(value)) {
      return 0;
    }

    return Math.max(
      0,
      Math.min(
        100,
        value
      )
    );
  }


  // ============================================
  // DETERMINE FLOOD STATUS
  //
  // CRITICAL:
  // HIGH SENSOR OR >= 70%
  //
  // WARNING:
  // MEDIUM SENSOR OR >= 40%
  //
  // SAFE:
  // BELOW 40% AND NO MEDIUM/HIGH
  // ============================================

  function calculateFloodStatus() {

    const medium =
      isActive("mediumStatus");

    const high =
      isActive("highStatus");

    const level =
      getWaterLevel();


    // ========================================
    // CRITICAL
    // ========================================

    if (
      high ||
      level >= HIGH_THRESHOLD
    ) {

      return {
        status: "CRITICAL",

        reason:
          high
            ? "HIGH level sensor detected water."
            : "Water level reached 70% or higher."
      };
    }


    // ========================================
    // WARNING
    // ========================================

    if (
      medium ||
      level >= MEDIUM_THRESHOLD
    ) {

      return {
        status: "WARNING",

        reason:
          medium
            ? "MEDIUM level sensor detected water."
            : "Water level reached 40% or higher."
      };
    }


    // ========================================
    // SAFE
    // ========================================

    return {
      status: "SAFE",

      reason:
        "Water level is within the safe range."
    };

  }


  // ============================================
  // ENABLE ALARM
  // ============================================

  enableBtn.addEventListener(
    "click",
    async function () {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          await audioContext.resume();
        }


        alarmEnabled = true;
        alarmMuted = false;


        enableBtn.textContent =
          "🔔 ALARM ENABLED";


        muteBtn.disabled = false;


        if (systemAlarm) {

          systemAlarm.textContent =
            "Enabled";
        }


        if (liveAlarmStatus) {

          liveAlarmStatus.textContent =
            "ENABLED";
        }


        /*
          Small test beep
        */

        playTestBeep();


        updateAlarmDisplay(
          lastCalculatedStatus
        );

      }

      catch (error) {

        console.error(
          "Alarm initialization failed:",
          error
        );

        alarmMessage.textContent =
          "Browser audio could not be enabled.";
      }

    }
  );


  // ============================================
  // MUTE / UNMUTE
  // ============================================

  muteBtn.addEventListener(
    "click",
    function () {

      alarmMuted =
        !alarmMuted;


      if (alarmMuted) {

        muteBtn.textContent =
          "🔊 UNMUTE";


        stopAlarmSound();


        alarmPanel.classList.remove(
          "alarm-active"
        );


        alarmMessage.textContent =
          "Alarm muted. Flood monitoring remains active.";


        if (liveAlarm) {

          liveAlarm.textContent =
            "MUTED";
        }

      }

      else {

        muteBtn.textContent =
          "🔇 MUTE";


        updateAlarmDisplay(
          lastCalculatedStatus
        );

      }

    }
  );


  // ============================================
  // TEST BEEP
  // ============================================

  function playTestBeep() {

    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      700;

    oscillator.type =
      "square";


    gain.gain.setValueAtTime(
      0.12,
      audioContext.currentTime
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }


  // ============================================
  // UPDATE FLOOD STATUS
  // ============================================

  function updateFloodStatus() {

    const result =
      calculateFloodStatus();

    const status =
      result.status;


    lastCalculatedStatus =
      status;


    const statusCard =
      document.getElementById(
        "statusCard"
      );

    const statusTitle =
      document.getElementById(
        "statusTitle"
      );

    const statusDescription =
      document.getElementById(
        "statusDescription"
      );

    const statusIcon =
      document.getElementById(
        "statusIcon"
      );

    const liveStatus =
      document.getElementById(
        "liveStatus"
      );

    const liveStatusSmall =
      document.getElementById(
        "liveStatusSmall"
      );

    const waterDetailStatus =
      document.getElementById(
        "waterDetailStatus"
      );


    // ========================================
    // STATUS CARD
    // ========================================

    if (statusCard) {

      statusCard.classList.remove(
        "safe",
        "warning",
        "critical"
      );


      statusCard.classList.add(
        status.toLowerCase()
      );

    }


    // ========================================
    // TITLE
    // ========================================

    if (statusTitle) {

      statusTitle.textContent =
        status;
    }


    // ========================================
    // ICON
    // ========================================

    if (statusIcon) {

      if (status === "CRITICAL") {

        statusIcon.textContent =
          "🚨";

      }

      else if (status === "WARNING") {

        statusIcon.textContent =
          "⚠";

      }

      else {

        statusIcon.textContent =
          "✓";
      }

    }


    // ========================================
    // DESCRIPTION
    // ========================================

    if (statusDescription) {

      if (status === "CRITICAL") {

        statusDescription.textContent =
          "CRITICAL FLOOD CONDITION: " +
          result.reason;

      }

      else if (status === "WARNING") {

        statusDescription.textContent =
          "WARNING: " +
          result.reason;

      }

      else {

        statusDescription.textContent =
          result.reason;
      }

    }


    // ========================================
    // LIVE STATUS
    // ========================================

    if (liveStatus) {

      liveStatus.textContent =
        status;
    }


    if (liveStatusSmall) {

      if (status === "CRITICAL") {

        liveStatusSmall.textContent =
          "Critical flood condition";

      }

      else if (status === "WARNING") {

        liveStatusSmall.textContent =
          "Warning flood condition";

      }

      else {

        liveStatusSmall.textContent =
          "Normal condition";
      }

    }


    // ========================================
    // WATER PAGE STATUS
    // ========================================

    if (waterDetailStatus) {

      waterDetailStatus.textContent =
        status;
    }


    // ========================================
    // UPDATE ALARM
    // ========================================

    updateAlarmDisplay(status);

  }


  // ============================================
  // ALARM DISPLAY
  // ============================================

  function updateAlarmDisplay(status) {

    if (!alarmPanel) {
      return;
    }


    alarmPanel.classList.remove(
      "alarm-safe",
      "alarm-warning",
      "alarm-critical",
      "alarm-active"
    );


    // ========================================
    // CRITICAL
    // ========================================

    if (status === "CRITICAL") {

      alarmPanel.classList.add(
        "alarm-critical"
      );


      alarmIcon.textContent =
        "🚨";


      alarmTitle.textContent =
        "CRITICAL FLOOD ALARM";


      alarmMessage.textContent =
        "CRITICAL condition detected. " +
        "Check the water level immediately.";


      if (
        alarmEnabled &&
        !alarmMuted
      ) {

        alarmPanel.classList.add(
          "alarm-active"
        );


        startAlarmSound();

      }


      if (liveAlarm) {

        liveAlarm.textContent =
          alarmEnabled && !alarmMuted
            ? "ACTIVE"
            : "MUTED";
      }

    }


    // ========================================
    // WARNING
    // ========================================

    else if (status === "WARNING") {

      alarmPanel.classList.add(
        "alarm-warning"
      );


      alarmIcon.textContent =
        "⚠️";


      alarmTitle.textContent =
        "FLOOD WARNING";


      alarmMessage.textContent =
        "WARNING condition detected. " +
        "Water level requires monitoring.";


      if (
        alarmEnabled &&
        !alarmMuted
      ) {

        alarmPanel.classList.add(
          "alarm-active"
        );


        startAlarmSound();

      }


      if (liveAlarm) {

        liveAlarm.textContent =
          alarmEnabled && !alarmMuted
            ? "ACTIVE"
            : "MUTED";
      }

    }


    // ========================================
    // SAFE
    // ========================================

    else {

      alarmPanel.classList.add(
        "alarm-safe"
      );


      alarmIcon.textContent =
        "🔕";


      alarmTitle.textContent =
        "FLOOD ALARM";


      alarmMessage.textContent =
        alarmEnabled
          ? "Alarm enabled. No active flood warning."
          : "Alarm is ready. Enable the alarm to receive audible warnings.";


      // ALWAYS STOP ALARM WHEN SAFE

      stopAlarmSound();


      if (liveAlarm) {

        liveAlarm.textContent =
          "OFF";
      }

    }


    if (liveAlarmCondition) {

      liveAlarmCondition.textContent =
        status;
    }

  }


  // ============================================
  // START ALARM SOUND
  // ============================================

  function startAlarmSound() {

    if (
      !alarmEnabled ||
      alarmMuted ||
      !audioContext
    ) {
      return;
    }


    /*
      Don't create another timer
      if one is already running.
    */

    if (alarmTimer) {
      return;
    }


    function playAlarmBeep() {

      if (
        !audioContext ||
        !alarmEnabled ||
        alarmMuted ||
        lastCalculatedStatus === "SAFE"
      ) {

        return;
      }


      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();


      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );


      // ======================================
      // CRITICAL = HIGHER PITCH
      // WARNING = LOWER PITCH
      // ======================================

      if (
        lastCalculatedStatus ===
        "CRITICAL"
      ) {

        oscillator.frequency.value =
          1000;

      }

      else {

        oscillator.frequency.value =
          600;
      }


      oscillator.type =
        "square";


      gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
      );


      oscillator.start();


      oscillator.stop(
        audioContext.currentTime + 0.25
      );

    }


    // Play immediately

    playAlarmBeep();


    // ========================================
    // REPEAT
    // ========================================

    const interval =
      lastCalculatedStatus === "CRITICAL"
        ? 700
        : 1500;


    alarmTimer =
      setInterval(
        playAlarmBeep,
        interval
      );

  }


  // ============================================
  // STOP ALARM SOUND
  // ============================================

  function stopAlarmSound() {

    if (alarmTimer) {

      clearInterval(
        alarmTimer
      );

      alarmTimer = null;
    }

  }


  // ============================================
  // CHECK STATUS EVERY 300ms
  // ============================================

  setInterval(
    updateFloodStatus,
    300
  );


  // ============================================
  // INITIAL STATUS
  // ============================================

  setTimeout(
    updateFloodStatus,
    500
  );

})();

</script>
